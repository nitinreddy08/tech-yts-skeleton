name: Refresh prices

# Daily at 04:00 India time (IST = UTC+5:30, i.e. 22:30 UTC the day before). GitHub cron is always UTC:
# change the line below for another hour. Scheduled workflows only run from the default branch.
on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      store:
        description: 'Only this store (amazon, flipkart, generic) - leave empty for all'
        required: false
        default: ''

permissions:
  contents: write # commit refreshed prices / repairs
  issues: write # open an issue when a repair can't be done automatically
  pull-requests: write # fall back to a PR when the branch is protected

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Git identity
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"

      # 1. Refresh. Exits 1 only when a store is "broken" (pages load, price unreadable). Prices that did
      #    refresh are still written, so we carry on to commit them before trying a repair.
      - name: Refresh prices
        id: refresh
        continue-on-error: true
        run: npm run prices:refresh -- ${{ inputs.store && format('--store {0}', inputs.store) || '' }}
        env:
          # Optional official-API credentials (see the `api` blocks in config/price-scrapers/*.json):
          STORE_API_TOKEN: ${{ secrets.STORE_API_TOKEN }}

      - name: Commit refreshed prices
        run: |
          git add data/prices.json data/price-health.json
          if git diff --staged --quiet; then
            echo "No price changes."
          else
            git commit -m "chore(prices): refresh live prices"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Warn about stores we could not reach
        if: always()
        run: |
          node -e "
            const h = require('./data/price-health.json').stores || {};
            for (const [s, v] of Object.entries(h))
              if (v.status === 'blocked' || v.status === 'degraded')
                console.log('::warning title=Price scraper: ' + s + ' is ' + v.status + '::' + JSON.stringify(v.failed) + ' - a layout fix will not help if the store is blocking us; consider its official API.');
          "

      # 2. A store's layout changed -> heal it automatically (plain code, no AI): `prices:heal` looks for where
      #    the last known price lives on the saved pages and adds a new selector. A guard, the offline tests and a
      #    live re-check must all pass before anything is committed and pushed; otherwise an issue is opened.
      - name: Auto-heal broken stores
        if: steps.refresh.outcome == 'failure'
        run: ./scripts/prices/ci-repair.sh
        env:
          STORE_API_TOKEN: ${{ secrets.STORE_API_TOKEN }}

      - name: Keep pages that stopped parsing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-fixtures
          path: data/price-fixtures/
          if-no-files-found: ignore
