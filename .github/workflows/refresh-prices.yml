name: Refresh prices

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Exits 1 only when a store is "broken" (pages load, price unreadable). Prices that
      # did refresh are still written, so we keep going to commit them.
      - name: Refresh prices
        id: refresh
        run: npm run prices:refresh
        continue-on-error: true
        env:
          # Optional official-API credentials (see config/price-scrapers/*.json `api` blocks):
          STORE_API_TOKEN: ${{ secrets.STORE_API_TOKEN }}

      - name: Commit refreshed prices
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.json data/price-health.json
          if git diff --staged --quiet; then
            echo "No price changes."
          else
            git commit -m "chore(prices): refresh live prices"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Keep pages that stopped parsing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-fixtures
          path: data/price-fixtures/
          if-no-files-found: ignore

      - name: Alert when a store layout changed
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::A store's page layout changed and its prices could not be read. Open data/price-health.json, then run '/update-scraper <store>' in Claude Code (download the 'price-fixtures' artifact if you need the saved pages)."
          exit 1
